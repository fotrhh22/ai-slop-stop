# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: ai-slop-stop-api
    runtime: python
    region: singapore
    # Free-plan trial: verify memory during the first actual CLIP evaluation.
    plan: free
    buildCommand: pip install -r server/requirements-render.txt && python -m server.prepare_clip
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - .python-version
        - render.yaml
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        sync: false
      - key: GEMINI_ROUTER_MODEL
        sync: false
      - key: ROUTER_PROVIDER
        value: gemini
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: CLIP_CACHE_DIR
        value: .cache/clip
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # Credentials are reserved for the next backend persistence integration.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
